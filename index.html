<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Filter Redux</title>
    <script src="https://unpkg.com/redux@4/dist/redux.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/react-redux@8/dist/react-redux.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 30px 0;
        }

        .container-custom {
            max-width: 1200px;
        }

        .filter-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .filter-section {
            margin-bottom: 20px;
        }

        .filter-section h5 {
            color: #333;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .filter-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .price-range-input {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .price-range-input input {
            width: 100px;
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 5px;
        }

        .reset-filters-btn {
            background: #dc3545;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .reset-filters-btn:hover {
            background: #c82333;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        .product-image {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
        }

        .product-info {
            padding: 20px;
        }

        .product-name {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .product-category {
            color: #667eea;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .product-price {
            font-size: 24px;
            font-weight: 700;
            color: #28a745;
            margin-bottom: 10px;
        }

        .product-rating {
            color: #f39c12;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .product-btn {
            width: 100%;
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .product-btn:hover {
            background: #764ba2;
        }

        .no-products {
            text-align: center;
            padding: 50px 20px;
            color: #666;
        }

        .no-products h4 {
            color: #333;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .filter-buttons {
                flex-direction: column;
            }

            .filter-btn {
                width: 100%;
            }

            .product-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { createStore } = Redux;
        const { Provider, useSelector, useDispatch } = ReactRedux;

        // Sample Products
        const PRODUCTS = [
            { id: 1, name: 'Laptop', category: 'Electronics', price: 50000, rating: '⭐⭐⭐⭐⭐' },
            { id: 2, name: 'Phone', category: 'Electronics', price: 30000, rating: '⭐⭐⭐⭐' },
            { id: 3, name: 'Headphones', category: 'Electronics', price: 5000, rating: '⭐⭐⭐⭐' },
            { id: 4, name: 'Shirt', category: 'Clothing', price: 1500, rating: '⭐⭐⭐' },
            { id: 5, name: 'Jeans', category: 'Clothing', price: 2500, rating: '⭐⭐⭐⭐' },
            { id: 6, name: 'Shoes', category: 'Clothing', price: 3000, rating: '⭐⭐⭐⭐' },
            { id: 7, name: 'Desk Lamp', category: 'Furniture', price: 2000, rating: '⭐⭐⭐' },
            { id: 8, name: 'Chair', category: 'Furniture', price: 5000, rating: '⭐⭐⭐⭐⭐' },
            { id: 9, name: 'Table', category: 'Furniture', price: 8000, rating: '⭐⭐⭐⭐' },
            { id: 10, name: 'Book', category: 'Books', price: 500, rating: '⭐⭐⭐⭐' },
            { id: 11, name: 'Novel', category: 'Books', price: 400, rating: '⭐⭐⭐⭐⭐' },
            { id: 12, name: 'Magazine', category: 'Books', price: 200, rating: '⭐⭐⭐' },
        ];

        // Actions
        const SET_CATEGORY_FILTER = 'SET_CATEGORY_FILTER';
        const SET_PRICE_FILTER = 'SET_PRICE_FILTER';
        const RESET_FILTERS = 'RESET_FILTERS';

        // Action Creators
        const setCategoryFilter = (category) => ({ type: SET_CATEGORY_FILTER, payload: category });
        const setPriceFilter = (minPrice, maxPrice) => ({ type: SET_PRICE_FILTER, payload: { minPrice, maxPrice } });
        const resetFilters = () => ({ type: RESET_FILTERS });

        // Initial State
        const initialState = {
            products: PRODUCTS,
            selectedCategory: null,
            priceRange: { minPrice: 0, maxPrice: 100000 }
        };

        // Reducer
        const filterReducer = (state = initialState, action) => {
            switch (action.type) {
                case SET_CATEGORY_FILTER:
                    return {
                        ...state,
                        selectedCategory: state.selectedCategory === action.payload ? null : action.payload
                    };
                case SET_PRICE_FILTER:
                    return {
                        ...state,
                        priceRange: action.payload
                    };
                case RESET_FILTERS:
                    return initialState;
                default:
                    return state;
            }
        };

        // Store
        const store = createStore(filterReducer);

        // Components
        function ProductFilterApp() {
            const dispatch = useDispatch();
            const { products, selectedCategory, priceRange } = useSelector(state => state);

            const categories = ['Electronics', 'Clothing', 'Furniture', 'Books'];

            const filteredProducts = products.filter(product => {
                const categoryMatch = !selectedCategory || product.category === selectedCategory;
                const priceMatch = product.price >= priceRange.minPrice && product.price <= priceRange.maxPrice;
                return categoryMatch && priceMatch;
            });

            const handlePriceChange = (field, value) => {
                const newRange = {
                    ...priceRange,
                    [field]: parseInt(value) || 0
                };
                dispatch(setPriceFilter(newRange.minPrice, newRange.maxPrice));
            };

            return (
                <div className="container container-custom">
                    <h1 className="text-center mb-4 mt-4" style={{ color: '#333', fontWeight: '600' }}>
                        🛍️ Product Filter System
                    </h1>

                    {/* Filter Card */}
                    <div className="filter-card">
                        <h4 style={{ color: '#333', marginBottom: '20px' }}>Filters</h4>

                        {/* Category Filter */}
                        <div className="filter-section">
                            <h5>Category</h5>
                            <div className="filter-buttons">
                                {categories.map(category => (
                                    <button
                                        key={category}
                                        className={`filter-btn ${selectedCategory === category ? 'active' : ''}`}
                                        onClick={() => dispatch(setCategoryFilter(category))}
                                    >
                                        {category}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* Price Filter */}
                        <div className="filter-section">
                            <h5>Price Range (₹)</h5>
                            <div className="price-range-input">
                                <input
                                    type="number"
                                    value={priceRange.minPrice}
                                    onChange={(e) => handlePriceChange('minPrice', e.target.value)}
                                    placeholder="Min"
                                />
                                <span>to</span>
                                <input
                                    type="number"
                                    value={priceRange.maxPrice}
                                    onChange={(e) => handlePriceChange('maxPrice', e.target.value)}
                                    placeholder="Max"
                                />
                            </div>
                        </div>

                        {/* Reset Button */}
                        <button className="reset-filters-btn" onClick={() => dispatch(resetFilters())}>
                            Reset All Filters
                        </button>
                    </div>

                    {/* Product Grid */}
                    {filteredProducts.length > 0 ? (
                        <div>
                            <p style={{ color: '#666', marginBottom: '20px' }}>
                                Showing {filteredProducts.length} product{filteredProducts.length !== 1 ? 's' : ''}
                            </p>
                            <div className="product-grid">
                                {filteredProducts.map(product => (
                                    <div key={product.id} className="product-card">
                                        <div className="product-image">
                                            {product.category === 'Electronics' && '📱'}
                                            {product.category === 'Clothing' && '👕'}
                                            {product.category === 'Furniture' && '🪑'}
                                            {product.category === 'Books' && '📚'}
                                        </div>
                                        <div className="product-info">
                                            <div className="product-category">{product.category}</div>
                                            <div className="product-name">{product.name}</div>
                                            <div className="product-price">₹{product.price.toLocaleString()}</div>
                                            <div className="product-rating">{product.rating}</div>
                                            <button className="product-btn">Add to Cart</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    ) : (
                        <div className="no-products">
                            <h4>No products found</h4>
                            <p>Try adjusting your filters</p>
                            <button className="reset-filters-btn" onClick={() => dispatch(resetFilters())}>
                                Reset Filters
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(
            <Provider store={store}>
                <ProductFilterApp />
            </Provider>,
            document.getElementById('root')
        );
    </script>
</body>
</html>
